<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gérer les projets</title>
  <link rel="icon" href="/assets/favicon/Favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/system.css">
  <link rel="stylesheet" href="/assets/css/admin.css"> <!-- Ajout pour les styles de login -->
  <link rel="stylesheet" href="/assets/css/manage.css">
  <style>
    .danger-small {
      background: #ff3b30;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.8;
    }
    .danger-small:hover { opacity: 1; }
  </style>
</head>
<body>
  <!-- Loader -->
  <div id="loader" class="loader-container">
      <div class="spinner"></div>
  </div>
  <!-- ------ -->
  <section class="Wrapper">
    <div class="Container">
      <!-- Login form -->
      <div id="Box1">
        <h1>🔐<br>Accès Admin</h1>
        <div id="password-screen" class="Container-Box1">
          <div class="Grp01">
            <input type="password" id="adminPassword" placeholder="Mot de passe admin"/>
            <button type="button" onclick="togglePasswordVisibility()">
              ⏿
            </button>
          </div>

          <button onclick="checkPassword()" class="Button01 Primary Medium" role="button">
            Accéder à la gestion
          </button>
          <p id="password-error" style="color:red; display:none;">Mot de passe incorrect.</p>
        </div>
      </div>

      <!-- Section sécurisée (cachée au départ) -->
      <div id="manage-section" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;">
        <h1>🗑️<br>Gérer les projets</h1>
        <p>Liste des projets présents dans <code>data.json</code>.
          <br>Supprimez un projet si nécessaire.
        </p>
  
        <div id="status"></div>
        <div id="manage-list" class="manage-list">Chargement...</div>
      </div>
    </div>
  </section>

  <script type="module">
    // On importe dynamiquement pour ne pas bloquer si le fichier manque, 
    // mais maintenant le fichier SERA présent car on va l'enlever du .gitignore
    // Cependant, on garde l'import dynamique par sécurité ou propreté.

    // 🔑 Mot de passe admin (identique à index.html)
    const ADMIN_PASSWORD = "login";

    // Fonction accessible globalement (nécessaire pour onclick)
    window.checkPassword = function() {
      const input = document.getElementById('adminPassword').value;
      if (input) {
        sessionStorage.setItem('admin_password', input);
        document.getElementById('password-screen').classList.add('hidden');
        document.getElementById('Box1').classList.add('hidden');
        
        const manageSection = document.getElementById('manage-section');
        manageSection.classList.remove('hidden');
        manageSection.style.display = 'flex'; 

        initDataLoad();
      } else {
        document.getElementById('password-error').style.display = 'block';
      }
    };

    // Ajout de l'écouteur d'événement pour la touche Entrée
    document.getElementById('adminPassword').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

    window.togglePasswordVisibility = function() {
      const passwordField = document.getElementById('adminPassword');
      const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordField.setAttribute('type', type);
    };

    const status = document.getElementById('status');
    const list = document.getElementById('manage-list');

    function getImageUrl(path){
      if(!path) return '';
      if(path.startsWith('http')) return path;
      return `../assets/images/${path}`;
    }

    async function loadDataLocal(){
      try{
        const r = await fetch('../data.json');
        if(!r.ok) throw new Error('Impossible de charger ../data.json');
        return await r.json();
      }catch(e){
        console.error(e);
        throw e;
      }
    }

    function getAdminPassword() {
        return sessionStorage.getItem('admin_password');
    }

    function renderProjects(data){
      list.innerHTML = '';
      const projects = data.projects || {};
      if(Object.keys(projects).length === 0){
        list.textContent = 'Aucun projet trouvé.';
        return;
      }

      Object.entries(projects).forEach(([id, project]) => {
        const item = document.createElement('div');
        item.className = 'manage-item';

        const img = document.createElement('img');
        img.className = 'manage-thumb';
        img.alt = project.title || id;
        img.src = getImageUrl(project.thumbnail || (project.images && project.images[0]) || '');
        img.loading = 'lazy';

        const meta = document.createElement('div');
        meta.className = 'manage-meta';
        meta.innerHTML = `<strong>${project.title || id}</strong><br><small>Catégorie: ${project.category || '-'}</small>`;

        // Si c'est un projet Visual Design, on affiche l'arborescence
        if (project.layout === 'visual-design' && project.groups) {
          const tree = document.createElement('div');
          tree.className = 'manage-tree';
          tree.style.marginTop = '10px';
          tree.style.paddingLeft = '20px';
          tree.style.fontSize = '0.9rem';

          Object.entries(project.groups).forEach(([year, months]) => {
            const yearEl = document.createElement('div');
            yearEl.style.marginBottom = '5px';
            yearEl.innerHTML = `<span>📅 ${year}</span> `;
            
            const delYearBtn = document.createElement('button');
            delYearBtn.textContent = 'Supprimer l\'année';
            delYearBtn.className = 'danger-small';
            delYearBtn.style.fontSize = '0.7rem';
            delYearBtn.style.marginLeft = '10px';
            delYearBtn.style.padding = '2px 6px';
            delYearBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              deleteRequest(id, project.title, year);
            });
            yearEl.appendChild(delYearBtn);

            const monthsList = document.createElement('ul');
            monthsList.style.listStyle = 'none';
            monthsList.style.paddingLeft = '20px';

            Object.keys(months).forEach(month => {
              const monthEl = document.createElement('li');
              monthEl.style.margin = '3px 0';
              monthEl.innerHTML = `<span>🌙 ${month}</span> `;
              
              const delMonthBtn = document.createElement('button');
              delMonthBtn.textContent = 'Supprimer';
              delMonthBtn.className = 'danger-small';
              delMonthBtn.style.fontSize = '0.7rem';
              delMonthBtn.style.marginLeft = '10px';
              delMonthBtn.style.padding = '2px 6px';
              delMonthBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteRequest(id, project.title, year, month);
              });
              monthEl.appendChild(delMonthBtn);
              monthsList.appendChild(monthEl);
            });

            yearEl.appendChild(monthsList);
            tree.appendChild(yearEl);
          });
          meta.appendChild(tree);
        }

        const actions = document.createElement('div');
        actions.className = 'manage-actions';

        const viewBtn = document.createElement('button');
        viewBtn.className = 'neutral';
        viewBtn.textContent = 'Voir';
        viewBtn.addEventListener('click', ()=>{
          window.open(`../projet.html?project=${id}`, '_blank');
        });

        const linkBtn = document.createElement('button');
        linkBtn.className = 'neutral';
        linkBtn.textContent = 'Lien';
        linkBtn.title = 'Modifier le lien du projet';
        linkBtn.addEventListener('click', async () => {
          const currentLink = project.link || "";
          const newLink = prompt(`Modifier le lien pour « ${project.title || id} » :`, currentLink);
          
          if (newLink === null || newLink === currentLink) return;

          const password = getAdminPassword();
          if (!password) {
              alert("Session expirée. Veuillez vous reconnecter.");
              location.reload();
              return;
          }

          linkBtn.disabled = true;
          status.textContent = 'Mise à jour du lien en cours...';

          try {
            const response = await fetch('/api/update-data', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'update',
                password: password,
                projectId: id,
                updatedData: { link: newLink }
              })
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Erreur lors de la mise à jour");

            project.link = newLink; // Mettre à jour localement
            status.textContent = `Lien mis à jour pour ${id}.`;
            alert("Lien mis à jour avec succès !");
          } catch (e) {
            console.error(e);
            status.textContent = 'Erreur : ' + e.message;
            if (e.message.includes('Accès refusé')) {
              sessionStorage.removeItem('admin_password');
              location.reload();
            }
          } finally {
            linkBtn.disabled = false;
          }
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.textContent = 'Supprimer';
        delBtn.addEventListener('click', async ()=>{
          deleteRequest(id, project.title);
        });

        async function deleteRequest(projectId, projectTitle, year = null, month = null) {
          let confirmMsg = `Supprimer définitivement le projet « ${projectTitle || projectId} » ?`;
          if (year && month) confirmMsg = `Supprimer le mois « ${month} » (${year}) du projet « ${projectTitle} » ?`;
          else if (year) confirmMsg = `Supprimer toute l'année « ${year} » du projet « ${projectTitle} » ?`;

          if(!confirm(confirmMsg)) return;
          
          const password = getAdminPassword();
          if (!password) {
              alert("Session expirée. Veuillez vous reconnecter.");
              location.reload();
              return;
          }

          status.textContent = 'Suppression en cours...';

          try {
            const body = {
              action: 'delete',
              password: password,
              projectId: projectId
            };
            if (year) body.year = year;
            if (month) body.month = month;

            const response = await fetch('/api/update-data', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Erreur lors de la suppression");
            
            status.textContent = `Action réussie sur ${projectId}.`;
            // Recharger les données pour mettre à jour la vue
            initDataLoad();
          } catch (e) {
            console.error(e);
            status.textContent = 'Erreur : ' + e.message;
            if(e.message.includes('Accès refusé')) {
                sessionStorage.removeItem('admin_password');
                location.reload();
            }
          }
        }

        actions.appendChild(viewBtn);
        actions.appendChild(linkBtn);
        actions.appendChild(delBtn);

        item.appendChild(img);
        item.appendChild(meta);
        item.appendChild(actions);

        list.appendChild(item);
      });
    }

    // Fonction d'init séparée, appelée après le login
    async function initDataLoad(){
      try{
        const data = await loadDataLocal();
        renderProjects(data);
      }catch(e){
        list.textContent = 'Erreur lors du chargement des projets.';
        status.textContent = e.message;
      }
    }

    // (async ()=>{ ... })(); // On ne lance plus automatiquement au chargement de la page

  </script>
<script src="../scripts/loader.js"></script>
</body>
</html>
