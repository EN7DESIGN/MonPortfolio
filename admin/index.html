<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Portfolio</title>
  <link rel="icon" href="/assets/favicon/Favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/system.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <!-- Loader -->
  <div id="loader" class="loader-container">
      <div class="spinner"></div>
  </div>
  <!-- ------ -->
  <section class="Wrapper">
    <div class="Container">
      <!-- Login form -->
      <div id="Box1">
        <h1>🗝️<br>Admin Portfolio</h1>
        <!-- Écran de mot de passe -->
        <div id="password-screen" class="Container-Box1">
          <div class="Grp01">
            <input type="password" id="adminPassword" placeholder="Mot de passe admin"/>
            <button type="button" onclick="togglePasswordVisibility()">
              ⏿
            </button>
          </div>

          <!-- <button onclick="checkPassword()">Accéder au formulaire</button> -->
          <button onclick="checkPassword()" class="Button01 Primary Medium" role="button">
            Accéder au formulaire
          </button>
          <p id="password-error" style="color:red; display:none;">Mot de passe incorrect.</p>
        </div>
      </div>

      <!-- Formulaire (caché au départ) -->
      <div id="form-section" class="hidden">
        <h2>➕<br>Ajouter un projet</h2>
        
        <!-- Sélecteur pour Visual Design -->
        <div id="vd-mode-container" class="VisualDesign-Selecteur">
          <label style="margin-right: 1rem; font-weight: 500;">Type d'ajout :</label>
          <label><input type="radio" name="vd-mode" value="new" checked> Nouveau projet</label>
          <label><input type="radio" name="vd-mode" value="append"> Ajouter à l'existant</label>
        </div>

        <div id="title-container">
          <input id="title" placeholder="Titre du projet" />
        </div>

        <div id="existing-project-container" class="hidden" style="margin-bottom: 1rem;">
          <label for="existingProjectList" style="display:block; margin-bottom:0.3rem; font-weight:500;">Sélectionner le projet :</label>
          <select id="existingProjectList" style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
            <option value="">Chargement des projets...</option>
          </select>
        </div>
        <select id="category">
          <option value="brand-identity">Brand identity</option>
          <option value="ui-ux-design">UI/UX design</option>
          <option value="visual-design">Visual design</option>
          <option value="graphic-design">Graphic design</option>
        </select>
        <textarea id="description" placeholder="Description"></textarea>
        
        <!-- Champs spécifiques pour Visual Design -->
        <div id="visual-design-fields" class="hidden" style="margin-top: 1rem; padding: 1rem; background: #f9f9f9; border-radius: 8px; border: 1px dashed #ccc;">
          <h4 style="margin-bottom: 1rem;">📅 Organisation temporelle</h4>
          <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
            <div style="flex: 1;">
              <label for="year" style="display:block; margin-bottom:0.3rem; font-size: 0.9rem;">Année (ex: 2026)</label>
              <input type="text" id="year" placeholder="2026" style="width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid #ddd;" />
            </div>
            <div style="flex: 1;">
              <label for="month" style="display:block; margin-bottom:0.3rem; font-size: 0.9rem;">Mois (ex: Avril)</label>
              <select id="month" style="width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid #ddd;">
                <option value="Janvier">Janvier</option>
                <option value="Février">Février</option>
                <option value="Mars">Mars</option>
                <option value="Avril">Avril</option>
                <option value="Mai">Mai</option>
                <option value="Juin">Juin</option>
                <option value="Juillet">Juillet</option>
                <option value="Août">Août</option>
                <option value="Septembre">Septembre</option>
                <option value="Octobre">Octobre</option>
                <option value="Novembre">Novembre</option>
                <option value="Décembre">Décembre</option>
              </select>
            </div>
          </div>
          <p style="font-size: 0.8rem; color: #666;">Note : Les images ci-dessous seront ajoutées à ce mois spécifique dans l'année choisie.</p>
        </div>
        
        <div style="margin-top: 1rem; margin-bottom: 1rem;">
          <label for="thumbnail" style="display:block; margin-bottom:0.5rem; font-weight:500;">🎨 Miniature (Liste des projets)</label>
          <input type="file" id="thumbnail" accept="image/*,video/*" />
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="projectImages" style="display:block; margin-bottom:0.5rem; font-weight:500;">🗞️ Médias du projet (Images ou Vidéos)</label>
          <input type="file" id="projectImages" accept="image/*,video/*" multiple />
          <div id="projectImagesList" style="margin-top:0.75rem; display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center;"></div>
          <div id="projectImagesCount" style="font-size:1rem; color:#444; margin-top:0.5rem;"></div>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="link" style="display:block; margin-bottom:0.5rem; font-weight:500;">🔗 Lien du projet (Optionnel)</label>
          <input id="link" placeholder="https://..." style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;" />
        </div>

        <!-- <button onclick="submitProject()">Publier le projet</button> -->
        <button onclick="submitProject()" class="Button01 Primary Medium" role="button">
            Publier le projet
        </button>
        <div id="status" style="font-size: 14px;"></div>
      </div>
    </div>
  </section>

<script>
  // 🔑 Change ce mot de passe
  const ADMIN_PASSWORD = "login";
  const CLOUD_NAME = "en7design"; 
  const UPLOAD_PRESET = "MonFolio";

  // Fonction accessible globalement (nécessaire pour onclick)
  window.checkPassword = function() {
    const passInput = document.getElementById('adminPassword').value;
    // On simule une vérification locale pour l'UI, 
    // mais la vraie validation se fera côté serveur lors de l'envoi.
    if (passInput) {
      sessionStorage.setItem('admin_password', passInput);
      document.getElementById('password-screen').classList.add('hidden');
      document.getElementById('form-section').classList.remove('hidden');
      document.getElementById('Box1').classList.add('hidden');
    } else {
      document.getElementById('password-error').style.display = 'block';
    }
  };

  // Ajout de l'écouteur d'événement pour la touche Entrée
  document.getElementById('adminPassword').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      checkPassword();
    }
  });

  function getAdminPassword() {
    return sessionStorage.getItem('admin_password');
  }

  // Gérer l'affichage des champs Visual Design
  document.getElementById('category').addEventListener('change', function() {
    const vdFields = document.getElementById('visual-design-fields');
    const vdMode = document.getElementById('vd-mode-container');
    if (this.value === 'visual-design') {
      vdFields.classList.remove('hidden');
      vdMode.classList.remove('hidden');
      loadExistingProjects();
    } else {
      vdFields.classList.add('hidden');
      vdMode.classList.add('hidden');
      document.getElementById('title-container').classList.remove('hidden');
      document.getElementById('existing-project-container').classList.add('hidden');
      document.getElementById('thumbnail').closest('div').classList.remove('hidden');
    }
  });

  // Gérer le switch Nouveau/Existant
  document.querySelectorAll('input[name="vd-mode"]').forEach(radio => {
    radio.addEventListener('change', function() {
      const isAppend = this.value === 'append';
      document.getElementById('title-container').classList.toggle('hidden', isAppend);
      document.getElementById('existing-project-container').classList.toggle('hidden', !isAppend);
      // Masquer la miniature si existant
      document.getElementById('thumbnail').closest('div').classList.toggle('hidden', isAppend);
      document.getElementById('description').classList.toggle('hidden', isAppend);
      document.getElementById('link').classList.toggle('hidden', isAppend);
    });
  });

  async function loadExistingProjects() {
    const select = document.getElementById('existingProjectList');
    try {
      const r = await fetch('../data.json');
      const data = await r.json();
      const vdProjects = Object.entries(data.projects || {}).filter(([id, p]) => p.category === 'visual-design');
      
      select.innerHTML = '';
      if (vdProjects.length === 0) {
        select.innerHTML = '<option value="">Aucun projet visual-design trouvé</option>';
        return;
      }
      
      vdProjects.forEach(([id, p]) => {
        const opt = document.createElement('option');
        opt.value = p.title; // L'API utilise le titre pour slugifier et fusionner
        opt.textContent = p.title.replace(/<[^>]*>/g, ' '); // Nettoyer HTML éventuel
        select.appendChild(opt);
      });
    } catch (e) {
      select.innerHTML = '<option value="">Erreur de chargement</option>';
    }
  }

  // Fonction pour uploader un média (image ou vidéo) sur Cloudinary
  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);

    // Utiliser 'auto' pour détecter automatiquement s'il s'agit d'une image ou d'une vidéo
    const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;

    const response = await fetch(url, {
      method: 'POST',
      body: formData
    });

    if (!response.ok) {
        const err = await response.json();
        throw new Error(`Erreur upload Cloudinary: ${err.error.message}`);
    }

    const data = await response.json();
    return data.secure_url;
  }

  // Prévisualisation et gestion des fichiers multiples (conserver les sélections successives)
  const projectImagesInput = document.getElementById('projectImages');
  const projectImagesList = document.getElementById('projectImagesList');
  const projectImagesCount = document.getElementById('projectImagesCount');

  let currentProjectFiles = [];

  function sameFile(a, b) {
    return a.name === b.name && a.size === b.size && a.lastModified === b.lastModified;
  }

  function rebuildInputFiles() {
    const dt = new DataTransfer();
    currentProjectFiles.forEach(f => dt.items.add(f));
    projectImagesInput.files = dt.files;
  }

  function updateProjectImagesPreview() {
    const files = currentProjectFiles;
    projectImagesList.innerHTML = '';
    projectImagesCount.textContent = files.length > 0 ? `${files.length} média(s) sélectionné(s)` : '';

    files.forEach((file, index) => {
      const isVideo = file.type.startsWith('video/');
      const wrapper = document.createElement('div');
      wrapper.style.position = 'relative';
      wrapper.style.width = '80px';
      wrapper.style.height = '80px';
      wrapper.style.borderRadius = '6px';
      wrapper.style.overflow = 'clip';

      let media;
      if (isVideo) {
        media = document.createElement('video');
        media.muted = true;
        media.loop = true;
        media.autoplay = true;
        media.playsInline = true;
      } else {
        media = document.createElement('img');
      }
      
      media.src = URL.createObjectURL(file);
      if (!isVideo) {
        media.loading = 'lazy';
        media.decoding = 'async';
      }
      media.style.width = '100%';
      media.style.height = '100%';
      media.style.objectFit = 'cover';
      media.alt = file.name;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '✕';
      btn.title = 'Retirer cette image';
      btn.style.position = 'absolute';
      btn.style.top = '2px';
      btn.style.right = '2px';
      btn.style.background = 'rgba(0,0,0,0.5)';
      btn.style.color = '#fff';
      btn.style.border = 'none';
      btn.style.borderRadius = '50%';
      btn.style.minWidth = '22px';
      btn.style.minHeight = '22px';
      btn.style.cursor = 'pointer';

      btn.addEventListener('click', () => {
        currentProjectFiles.splice(index, 1);
        rebuildInputFiles();
        updateProjectImagesPreview();
      });

      wrapper.appendChild(media);
      wrapper.appendChild(btn);
      projectImagesList.appendChild(wrapper);
    });
  }

  projectImagesInput.addEventListener('change', (e) => {
    const added = Array.from(e.target.files || []);
    // Ajouter uniquement les fichiers non dupliqués
    added.forEach(af => {
      const exists = currentProjectFiles.some(cf => sameFile(cf, af));
      if (!exists) currentProjectFiles.push(af);
    });
    rebuildInputFiles();
    updateProjectImagesPreview();
  });

  // Fonction pour soumettre le projet
  window.submitProject = async function() {
    const status = document.getElementById('status');
    status.textContent = "Envoi en cours...";

    try {
      const password = getAdminPassword();
      if (!password) {
        status.textContent = "Session expirée. Veuillez vous reconnecter.";
        setTimeout(() => location.reload(), 2000);
        return; 
      }

      let title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      
      const isVisualDesign = category === 'visual-design';
      const vdMode = document.querySelector('input[name="vd-mode"]:checked')?.value || 'new';
      const isAppend = isVisualDesign && vdMode === 'append';

      if (isAppend) {
        title = document.getElementById('existingProjectList').value;
        if (!title) throw new Error("Veuillez sélectionner un projet existant.");
      }

      const thumbnailInput = document.getElementById('thumbnail');
      const thumbnailFile = thumbnailInput.files[0];
      const projectFiles = currentProjectFiles.slice();

      const year = document.getElementById('year').value;
      const month = document.getElementById('month').value;

      // Validation
      if (!title || projectFiles.length === 0) {
        throw new Error("Le titre et au moins un média de projet sont requis.");
      }
      if (!isAppend && !thumbnailFile && category !== 'visual-design') {
         // Petite souplesse pour visual design merge, mais pour un nouveau projet thumbnail est mieux
         // On laisse l'API décider du fallback sinon.
      }

      if (isVisualDesign && !year) {
        throw new Error("L'année est requise pour la catégorie Visual Design.");
      }

      status.textContent = "Upload des médias vers Cloudinary...";

      // Upload des images vers Cloudinary
      let thumbnailUrl = "";
      if (thumbnailFile) {
        status.textContent = "Upload de la miniature...";
        thumbnailUrl = await uploadToCloudinary(thumbnailFile);
      }
      
      status.textContent = "Upload des médias du projet...";
      const projectImagesPromises = projectFiles.map(f => uploadToCloudinary(f));
      const projectImagesUrls = await Promise.all(projectImagesPromises);

      status.textContent = "Mise à jour de la base de données...";

      // Données à envoyer
      const payload = {
        action: 'add',
        password: password,
        data: {
          title,
          description,
          category,
          images: projectImagesUrls, // Pour Visual Design, ce sont les images du mois
          thumbnail: thumbnailUrl,
          link: document.getElementById('link').value
        }
      };

      if (category === 'visual-design') {
        payload.data.year = year;
        payload.data.month = month;
      } else {
        // Pour les autres catégories, on garde la convention index 0 = miniature si pas de thumbnail séparé
        if (thumbnailUrl) {
          payload.data.images = [thumbnailUrl, ...projectImagesUrls];
        }
      }

      // 🚀 Envoie les données à notre API Vercel
      const response = await fetch('/api/update-data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "Erreur lors de la mise à jour");

      status.innerHTML = `
        <h3>✅ Projet ajouté avec succès !</h3>
        <p>Les images ont été hébergées sur Cloudinary et data.json a été mis à jour.</p>
        <p>Actualise ton site dans quelques minutes (le temps que GitHub Pages se mette à jour).</p>
      `;

      // Réinitialiser le formulaire
      document.getElementById('title').value = '';
      document.getElementById('description').value = '';
      thumbnailInput.value = '';
      projectImagesInput.value = '';
      document.getElementById('link').value = '';
      currentProjectFiles = [];
      rebuildInputFiles();
      updateProjectImagesPreview();

    } catch (error) {
      console.error(error);
      if(error.message.includes('Accès refusé')) {
         sessionStorage.removeItem('admin_password');
         status.textContent = "❌ Erreur : Mot de passe incorrect.";
         setTimeout(() => location.reload(), 2000); 
      } else {
         status.innerHTML = `❌ Erreur :<br>${error.message}`;
      }
    }
  };
  window.togglePasswordVisibility = function() {
    const passwordField = document.getElementById('adminPassword');
    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordField.setAttribute('type', type);
  };
</script>

<script src="../scripts/loader.js"></script>
</body>
</html>
