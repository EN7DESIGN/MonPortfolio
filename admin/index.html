<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Portfolio</title>
  <link rel="icon" href="/assets/favicon/Favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/system.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <section class="Wrapper">
    <div class="Container">
      <!-- Login form -->
      <div id="Box1">
        <h1>🗝️<br>Admin Portfolio</h1>
        <!-- Écran de mot de passe -->
        <div id="password-screen" class="Container-Box1">
          <div class="Grp01">
            <input type="password" id="adminPassword" placeholder="Mot de passe admin"/>
            <button type="button" onclick="togglePasswordVisibility()">
              ⏿
            </button>
          </div>

          <!-- <button onclick="checkPassword()">Accéder au formulaire</button> -->
          <button onclick="checkPassword()" class="Button01 Primary Medium" role="button">
            Accéder au formulaire
          </button>
          <p id="password-error" style="color:red; display:none;">Mot de passe incorrect.</p>
        </div>
      </div>

      <!-- Formulaire (caché au départ) -->
      <div id="form-section" class="hidden">
        <h2>➕<br>Ajouter un projet</h2>
        <input id="title" placeholder="Titre du projet" />
        <select id="category">
          <option value="brand-identity">Brand identity</option>
          <option value="ui-ux-design">UI/UX design</option>
          <option value="visual-design">Visual design</option>
          <option value="graphic-design">Graphic design</option>
        </select>
        <textarea id="description" placeholder="Description"></textarea>
        
        <div style="margin-top: 1rem; margin-bottom: 1rem;">
          <label for="thumbnail" style="display:block; margin-bottom:0.5rem; font-weight:500;">🎨 Miniature (Liste des projets)</label>
          <input type="file" id="thumbnail" accept="image/*" />
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="projectImages" style="display:block; margin-bottom:0.5rem; font-weight:500;">🗞️ Images du projet</label>
          <input type="file" id="projectImages" accept="image/*" multiple />
          <div id="projectImagesList" style="margin-top:0.75rem; display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center;"></div>
          <div id="projectImagesCount" style="font-size:1rem; color:#444; margin-top:0.5rem;"></div>
        </div>

        <!-- <button onclick="submitProject()">Publier le projet</button> -->
        <button onclick="submitProject()" class="Button01 Primary Medium" role="button">
            Publier le projet
        </button>
        <div id="status" style="font-size: 14px;"></div>
      </div>
    </div>
  </section>

<script>
  // 🔑 Change ce mot de passe
  const ADMIN_PASSWORD = "login";
  const CLOUD_NAME = "en7design"; 
  const UPLOAD_PRESET = "MonFolio";

  // Fonction accessible globalement (nécessaire pour onclick)
  window.checkPassword = function() {
    const input = document.getElementById('adminPassword').value;
    if (input === ADMIN_PASSWORD) {
      document.getElementById('password-screen').classList.add('hidden');
      document.getElementById('form-section').classList.remove('hidden');
      document.getElementById('Box1').classList.add('hidden');
    } else {
      document.getElementById('password-error').style.display = 'block';
    }
  };

  // Fonction pour uploader une image sur Cloudinary
  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);

    const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

    const response = await fetch(url, {
      method: 'POST',
      body: formData
    });

    if (!response.ok) {
        const err = await response.json();
        throw new Error(`Erreur upload Cloudinary: ${err.error.message}`);
    }

    const data = await response.json();
    return data.secure_url;
  }

  // Prévisualisation et gestion des fichiers multiples (conserver les sélections successives)
  const projectImagesInput = document.getElementById('projectImages');
  const projectImagesList = document.getElementById('projectImagesList');
  const projectImagesCount = document.getElementById('projectImagesCount');

  let currentProjectFiles = [];

  function sameFile(a, b) {
    return a.name === b.name && a.size === b.size && a.lastModified === b.lastModified;
  }

  function rebuildInputFiles() {
    const dt = new DataTransfer();
    currentProjectFiles.forEach(f => dt.items.add(f));
    projectImagesInput.files = dt.files;
  }

  function updateProjectImagesPreview() {
    const files = currentProjectFiles;
    projectImagesList.innerHTML = '';
    projectImagesCount.textContent = files.length > 0 ? `${files.length} image(s) sélectionnée(s)` : '';

    files.forEach((file, index) => {
      const wrapper = document.createElement('div');
      wrapper.style.position = 'relative';
      wrapper.style.width = '80px';
      wrapper.style.height = '80px';
      wrapper.style.borderRadius = '6px';
      wrapper.style.overflow = 'clip';

      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.loading = 'lazy';
      img.decoding = 'async';
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.alt = file.name;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '✕';
      btn.title = 'Retirer cette image';
      btn.style.position = 'absolute';
      btn.style.top = '2px';
      btn.style.right = '2px';
      btn.style.background = 'rgba(0,0,0,0.5)';
      btn.style.color = '#fff';
      btn.style.border = 'none';
      btn.style.borderRadius = '50%';
      btn.style.minWidth = '22px';
      btn.style.minHeight = '22px';
      btn.style.cursor = 'pointer';

      btn.addEventListener('click', () => {
        currentProjectFiles.splice(index, 1);
        rebuildInputFiles();
        updateProjectImagesPreview();
      });

      wrapper.appendChild(img);
      wrapper.appendChild(btn);
      projectImagesList.appendChild(wrapper);
    });
  }

  projectImagesInput.addEventListener('change', (e) => {
    const added = Array.from(e.target.files || []);
    // Ajouter uniquement les fichiers non dupliqués
    added.forEach(af => {
      const exists = currentProjectFiles.some(cf => sameFile(cf, af));
      if (!exists) currentProjectFiles.push(af);
    });
    rebuildInputFiles();
    updateProjectImagesPreview();
  });

  // Fonction pour soumettre le projet
  window.submitProject = async function() {
    const status = document.getElementById('status');
    status.textContent = "Envoi en cours...";

    try {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      
      const thumbnailInput = document.getElementById('thumbnail');
      const thumbnailFile = thumbnailInput.files[0];
      const projectFiles = currentProjectFiles.slice();

      // Validation
      if (!title || !thumbnailFile || projectFiles.length === 0) {
        throw new Error("Le titre, la miniature et au moins une image de projet sont requis.");
      }

      status.textContent = "Upload des images en cours...";

      // Upload des images vers Cloudinary
      const thumbnailUrlPromise = uploadToCloudinary(thumbnailFile);
      const projectImagesPromises = projectFiles.map(f => uploadToCloudinary(f));

      const thumbnailUrl = await thumbnailUrlPromise;
      const projectImagesUrls = await Promise.all(projectImagesPromises);

      status.textContent = "Mise à jour de GitHub...";

      // Convention : index 0 = Miniature, ensuite les images du projet
      const imagesList = [thumbnailUrl, ...projectImagesUrls];

      // ⚙️ Importe la fonction de mise à jour
      const { addProjectToData } = await import('./update-data.js');

      // 🚀 Envoie les données à GitHub
      const newId = await addProjectToData({
        title,
        description,
        category,
        images: imagesList
      });

      status.innerHTML = `
        <h3>✅ Projet ajouté avec succès !</h3>
        <p>ID : <code>${newId}</code></p>
        <p>Les images ont été hébergées sur Cloudinary.</p>
        <p>Actualise ton site dans quelques minutes (le temps que GitHub Pages se mette à jour).</p>
      `;

      // Réinitialiser le formulaire
      document.getElementById('title').value = '';
      document.getElementById('description').value = '';
      thumbnailInput.value = '';
      projectImagesInput.value = '';
      currentProjectFiles = [];
      rebuildInputFiles();
      updateProjectImagesPreview();

    } catch (error) {
      console.error(error);
      status.innerHTML = `❌ Erreur :<br>${error.message}`;
    }
  };
  window.togglePasswordVisibility = function() {
    const passwordField = document.getElementById('adminPassword');
    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordField.setAttribute('type', type);
  };
</script>

</body>
</html>
